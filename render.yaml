services:
  - type: web_service
    name: fuchiball-backend
    env: node
    root: backend
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
  - type: static_site
    name: fuchiball-frontend
    env: static
    root: frontend
    plan: starter
    buildCommand: npm install && npm run build
    publishPath: dist
